<svg xmlns="http://www.w3.org/2000/svg" width="124" height="106" viewBox="0 0 124 106" role="img" aria-labelledby="title">
  <title id="title">A tiny ASCII avatar gently bobbing up and down</title>
  <style>
    text { fill: #24292f; font: 13px 'Courier New', monospace; white-space: pre; }
    .avatar { animation: idle 3s ease-in-out infinite; }
    @keyframes idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-color-scheme: dark) { text { fill: #e6edf3; } }
    @media (prefers-reduced-motion: reduce) { .avatar { animation: none; } }
  </style>
  <g class="avatar">
    <text x="14" y="23">  .----.</text>
    <text x="14" y="37"> / #### \</text>
    <text x="14" y="51"> | o  o |</text>
    <text x="14" y="65"> |  __  |</text>
    <text x="14" y="79">  \____/</text>
    <text x="14" y="93">  /|  |\</text>
  </g>
</svg>
