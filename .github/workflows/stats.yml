name: refresh profile stats
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: refresh aggregate language chart
        run: |
          if [ -n "$GITHUB_TOKEN" ]; then
            node scripts/stats.mjs
          else
            echo 'Keeping the existing language chart until private access is configured.'
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.LANGUAGE_STATS_TOKEN }}
          INCLUDE_PRIVATE: 'true'
      - uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
      - run: node scripts/calendar.mjs
      - run: node scripts/game-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: save cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/contributions.json assets/stats.svg assets/languages-*.svg assets/contributions-*.svg profile-3d-contrib
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile stats'
            git push
          fi
